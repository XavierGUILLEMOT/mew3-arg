<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEW3 Panneau Admin</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
  <div class="lang-switcher">
    <label id="langLabelAdmin" for="langSelectAdmin">Langue</label>
    <select id="langSelectAdmin" aria-label="Sélecteur de langue">
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>
  </div>

  <header class="panel">
    <h1 id="adminTitle">MEW3 ADMIN</h1>
    <p id="adminSubtitle">Gérez les codes, utilisateurs et revendications récentes.</p>
  </header>

  <section class="panel auth">
    <label id="adminTokenLabel" for="adminToken">Jeton admin</label>
    <div class="row">
      <input id="adminToken" type="password" placeholder="Jeton Bearer">
      <button id="saveTokenBtn">Enregistrer le jeton</button>
      <button id="refreshAllBtn">Tout actualiser</button>
    </div>
    <p id="authStatus" class="status"></p>
  </section>

  <section class="panel">
    <h2 id="codeSectionTitle">Créer ou mettre à jour un code</h2>
    <div class="row form-grid">
      <input id="newCode" placeholder="code">
      <input id="newLabel" placeholder="libellé (optionnel)">
      <input id="newMaxClaims" type="number" min="1" value="100" placeholder="max revendications">
      <button id="createCodeBtn">Enregistrer le code</button>
    </div>
    <p id="codeCreateStatus" class="status"></p>
  </section>

  <section class="panel">
    <h2 id="accessCodesTitle">Codes d'accès</h2>
    <div id="codesTableWrap" class="table-wrap"></div>
  </section>

  <section class="panel">
    <h2 id="usersTitle">Utilisateurs</h2>
    <div id="usersTableWrap" class="table-wrap"></div>
  </section>

  <section class="panel">
    <h2 id="recentClaimsTitle">Revendications récentes</h2>
    <div id="claimsTableWrap" class="table-wrap"></div>
  </section>
</div>

<script src="site-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
